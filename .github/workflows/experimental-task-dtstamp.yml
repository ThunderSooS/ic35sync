name: Task metadata fix Windows build
on:
  push:
    branches: [experiment/task-delete-dtstamp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/experiment/task-delete-dtstamp'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install -r build-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test unchanged planner and new helper
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Integrate targeted fix into build source
        run: |
          python scripts/prepare_task_metadata_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test integrated fix and build EXE with frozen-app smoke checks
        env:
          IC35_EXPECT_TASK_METADATA_FIX: '1'
        run: |
          python scripts/build_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record EXE checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          exe = Path('dist/IC35Thunderbird.exe')
          if not exe.is_file() or not exe.stat().st_size:
              raise RuntimeError('EXE missing')
          Path('build-evidence/EXE-SHA256.txt').write_text(hashlib.sha256(exe.read_bytes()).hexdigest() + '  IC35Thunderbird.exe\n', encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: IC35-task-metadata-fix-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/IC35Thunderbird.exe
            release/*.xpi
            smoke-results.json
            build-evidence/
            LICENSE
            THIRD_PARTY_NOTICES.md
            build-licenses/
            build-requirements.txt

name: Experimental task DTSTAMP Windows build

on:
  push:
    branches: [experiment/task-delete-dtstamp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/experiment/task-delete-dtstamp'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install -r build-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test original source
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Activate candidate in disposable build checkout
        shell: python
        run: |
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          path = Path('dav_sync.py')
          original_bytes = path.read_bytes()
          source = original_bytes.decode('utf-8-sig')
          patch = Path('patches/task-delete-dtstamp.patch').read_text(encoding='utf-8')
          additions = '\n'.join(line[1:] for line in patch.splitlines()
                                if line.startswith('+') and not line.startswith('+++'))
          marker = 'def build_plan('
          if additions.count(marker) != 1:
              raise RuntimeError('Unexpected candidate patch structure')
          helpers = additions[:additions.index(marker)]
          tree = ast.parse(helpers)
          names = [node.name for node in tree.body if isinstance(node, ast.FunctionDef)]
          expected = ['_task_content_unchanged', '_remote_unchanged_for_delete']
          if names != expected or len(tree.body) != 2:
              raise RuntimeError('Unexpected candidate helpers')
          old = "r['semantic'] == binding['remote'] and r.get('content') == binding.get('remote_content', r.get('content'))"
          if source.count(old) != 1 or any('def ' + name + '(' in source for name in expected):
              raise RuntimeError('Source has changed; refusing automatic candidate activation')
          candidate = source.replace(old, '_remote_unchanged_for_delete(r, binding)') + '\n' + helpers
          compile(candidate, str(path), 'exec')
          path.write_bytes(candidate.encode('utf-8'))
          out = Path('experimental-build')
          out.mkdir()
          (out / 'dav_sync.py').write_bytes(path.read_bytes())
          diff = subprocess.run(['git', 'diff', '--', 'dav_sync.py'], check=True, capture_output=True).stdout
          (out / 'applied-candidate.diff').write_bytes(diff)
          report = {
              'status': 'experimental, not an official release',
              'repository_commit': os.environ['GITHUB_SHA'],
              'source_modified_in_build_checkout_only': True,
              'original_dav_sync_sha256': hashlib.sha256(original_bytes).hexdigest(),
              'candidate_dav_sync_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'hardware_validation': 'not performed',
              'real_Thunderbird_validation': 'not performed',
              'DTSTAMP_as_user_conflict_cause': 'not confirmed'
          }
          (out / 'build-provenance.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          (out / 'READ-ME-FIRST.txt').write_text(
              'EXPERIMENTAL WINDOWS TEST BUILD - NOT AN OFFICIAL RELEASE\n'
              'The DTSTAMP task-deletion candidate is enabled in this EXE.\n'
              'Do not use with your only copy of real organizer data.\n'
              'Back up IC35 and Thunderbird data before any real-data test.\n'
              'No real IC35 or personal Thunderbird profile was tested by this build.\n'
              'DTSTAMP has not been confirmed as the cause of the reported conflict.\n'
              'This artifact is a portable EXE and add-on, not a new installer.\n'
              'Internal app version labels have not been changed.\n'
              'Build-script tests and synthetic EXE smoke checks must pass before upload.\n',
              encoding='utf-8')
      - name: Build EXE, run candidate suite and frozen-app smoke checks
        run: |
          python scripts/build_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload experimental EXE and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: IC35-experimental-task-dtstamp-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/IC35Thunderbird.exe
            release/*.xpi
            smoke-results.json
            experimental-build/
            LICENSE
            THIRD_PARTY_NOTICES.md
            build-licenses/
            build-requirements.txt

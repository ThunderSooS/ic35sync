name: IC35 Sync Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish IC35 Sync 3.4.0 after validation
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ic35-final-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IC35_EXPECT_TASK_METADATA_FIX: '1'
      PUBLISH_RELEASE: >-
        ${{ (github.event_name == 'push' && github.event.head_commit.message == 'release: publish IC35 Sync 3.4.0') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install -r build-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure installer compiler is available
        run: |
          $compilers = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $compilers -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build, validate and optionally publish
        run: |
          if ($env:PUBLISH_RELEASE -eq 'true') {
            python scripts/build_final_release.py --publish
          } else {
            python scripts/build_final_release.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: IC35-Sync-3.4.0-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            release/IC35-Sync-3.4.0-Setup.exe
            release/IC35-Sync-3.4.0-Source.zip
            release/IC35-Sync-3.4.0-Windows.zip
            release/IC35-Thunderbird-Bridge-3.4.0.13.xpi
            release/BUILD-MANIFEST.json
            release/SHA256SUMS.txt
            smoke-results.json
            smoke-results-exe.json

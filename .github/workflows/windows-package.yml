name: Main Windows EXE and installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      IC35_EXPECT_TASK_METADATA_FIX: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        run: |
          python -m pip install -r build-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure Inno Setup compiler is installed
        run: |
          $compilers = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $compilers -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build onedir app, validate installer and package matching source
        run: |
          python scripts/build_beta_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload checked onedir beta package
        uses: actions/upload-artifact@v4
        with:
          name: IC35-Sync-Beta-3.4.0b7-onedir-main-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/IC35Thunderbird/
            release/IC35-Sync-Beta-3.4.0b7-Setup.exe
            release/IC35-Sync-Beta-3.4.0b7-Source.zip
            release/IC35-Thunderbird-Bridge-3.4.0b5.xpi
            release/BUILD-MANIFEST.json
            release/SHA256SUMS.txt
            release/BUILD-CHECKOUT.diff
            release/START-HERE.txt
            smoke-results.json
            smoke-results-exe.json
            LICENSE
            THIRD_PARTY_NOTICES.md
            build-licenses/
            build-requirements.txt
